<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">CloudBiz AWS hybrid networking lab</title><desc id="desc">A Mac test host routes the VPC CIDR to an Ubuntu strongSwan router behind home NAT. Two keyed VTI interfaces connect to a Virtual Private Gateway. The tested EC2 private address is in a public subnet. Other subnets and the separate portfolio were not part of traffic validation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#67d9ed" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="680" rx="22" fill="#091526"/>
<g font-family="Arial, sans-serif" fill="#eef5ff"><text x="42" y="49" font-size="27" font-weight="700">CloudBiz · AWS Site-to-Site VPN Lab</text><text x="42" y="79" font-size="15" fill="#a8bbd2">Verified traffic paths · us-east-1 · personal lab · credentials and public endpoints omitted</text>
<rect x="35" y="110" width="355" height="442" rx="18" fill="#112239" stroke="#354d68"/><text x="57" y="143" font-size="19" font-weight="700">Home LAN · 192.168.1.0/24</text>
<rect x="58" y="163" width="309" height="78" rx="12" fill="#1a3350"/><text x="78" y="193" font-size="18">Mac test host · 192.168.1.25</text><text x="78" y="220" font-size="14" fill="#b8cee3">10.20.0.0/16 → Ubuntu</text>
<path d="M212 242V273" stroke="#67d9ed" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="58" y="278" width="309" height="122" rx="12" fill="#163a4b" stroke="#46bdd0"/><text x="78" y="308" font-size="18">Ubuntu / strongSwan 5.9.13</text><text x="78" y="336" font-size="15">192.168.1.203 · ARM64 / UTM</text><text x="78" y="361" font-size="14" fill="#c0dbe5">VTI1 key 100 / VTI2 key 200</text><text x="78" y="383" font-size="14" fill="#c0dbe5">MTU 1400 · narrow forwarding</text>
<path d="M212 401V432" stroke="#67d9ed" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="58" y="438" width="309" height="86" rx="12" fill="#1a3350"/><text x="78" y="468" font-size="17">Spectrum router · NAT</text><text x="78" y="495" font-size="14" fill="#b8cee3">Default internet route unchanged</text><text x="78" y="516" font-size="12" fill="#8faac7">CGW definition maps the home public IPv4</text>
<rect x="422" y="174" width="316" height="321" rx="18" fill="#102c3d" stroke="#24768a"/><text x="443" y="207" font-size="19" font-weight="700">AWS Site-to-Site VPN</text><text x="443" y="235" font-size="14" fill="#b9d6e3">Static · no acceleration · IKEv2</text>
<rect x="442" y="260" width="276" height="76" rx="10" fill="#16434e"/><text x="458" y="289" font-size="17">Tunnel 1 · primary metric 100</text><text x="458" y="315" font-size="14">169.254.134.40/30</text>
<rect x="442" y="353" width="276" height="76" rx="10" fill="#16434e"/><text x="458" y="382" font-size="17">Tunnel 2 · backup metric 200</text><text x="458" y="408" font-size="14">169.254.9.104/30</text>
<text x="443" y="460" font-size="14" fill="#b9d6e3">AES-256-GCM · NAT-T / UDP 4500</text>
<path d="M368 478H405V300H440 M405 392H440" fill="none" stroke="#67d9ed" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="773" y="110" width="391" height="442" rx="18" fill="#152538" stroke="#52607b"/><text x="793" y="143" font-size="19" font-weight="700">AWS VPC · 10.20.0.0/16</text>
<rect x="795" y="166" width="347" height="71" rx="12" fill="#2a3452"/><text x="812" y="194" font-size="17">Virtual Private Gateway</text><text x="812" y="219" font-size="14" fill="#c2d1e6">Home static route: 192.168.1.0/24</text>
<path d="M719 300H750V204H793 M719 392H750V300" fill="none" stroke="#67d9ed" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M970 238V269" stroke="#67d9ed" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="795" y="275" width="347" height="124" rx="12" fill="#253c58"/><text x="812" y="304" font-size="17">Public subnet · test EC2</text><text x="812" y="333" font-size="17">Private address: 10.20.1.108</text><text x="812" y="361" font-size="14" fill="#c2d1e6">Return route to home → VGW</text><text x="812" y="384" font-size="14" fill="#c2d1e6">SSM administration · no SSH ingress</text>
<rect x="795" y="420" width="347" height="104" rx="12" fill="#192a3b" stroke="#53667b" stroke-dasharray="5 5"/><text x="812" y="450" font-size="16">Other 3 subnets preserved</text><text x="812" y="477" font-size="14" fill="#a7bbd1">Private-subnet workloads not tested</text><text x="812" y="501" font-size="14" fill="#a7bbd1">Separate portfolio stack unchanged</text>
<text x="43" y="592" font-size="16" font-weight="700">Validation scope</text><text x="43" y="620" font-size="15" fill="#b8cee3">Private HTTP + ICMP in both directions · per-tunnel traffic tests · route withdrawal and recovery</text><text x="43" y="647" font-size="14" fill="#8faac7">Diagram shows the test topology. Lifecycle and final results are recorded in README.md and evidence/.</text>
</g></svg>
