name: Roll back portfolio
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character SHA of a previously verified saved release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: portfolio-production
  cancel-in-progress: false
jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: portfolio-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Restore and verify saved release
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: python scripts/deploy.py rollback --sha "$RELEASE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rollback-proof-${{ github.run_id }}
          path: artifacts/deployment.json
          if-no-files-found: warn
          retention-days: 90
